<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NorthPeak Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Welcome to NorthPeak Digital</h1>
    <p>Your trusted digital agency</p>
    <button onclick="window.location.href='services.html'">Get Started</button>
  </section>

  <!-- Help Desk button at top right -->
  <div class="help-desk">
    <button id="helpBtn">Help Desk</button>
  </div>

  <!-- Contact Us Sidebar (hidden initially) -->
  <div id="contactSidebar" class="sidebar" style="display:none;">
    <h2>Contact Us</h2>
    <form id="contactForm">
      <label for="name">Name</label><br>
      <input type="text" id="name" name="name" required><br><br>

      <label for="email">Email</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="message">Message</label><br>
      <textarea id="message" name="message" rows="4" required></textarea><br><br>

      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Footer -->
  <footer>
    <p>Built for Digital Heroes Training Task | 
      <a href="https://digitalheroesco.com">digitalheroesco.com</a>
    </p>
  </footer>

  <!-- Script must be at the bottom -->
<script src="script.js"></script>
</body>
</html>
